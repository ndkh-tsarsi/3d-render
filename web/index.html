<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D → HTML5 Sprite Preview</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Blender automation output</p>
        <h1>HTML5 sprite preview</h1>
        <p>Every frame below is rendered from the original rig and played from the generated atlas metadata.</p>
      </header>
      <section class="controls" aria-label="Preview controls">
        <label>Character <select id="asset"></select></label>
        <label>Animation <select id="animation"></select></label>
        <label class="check"><input id="mirror" type="checkbox" /> Mirror</label>
        <button id="pause" type="button">Pause</button>
      </section>
      <section class="stage-shell">
        <canvas id="stage" width="256" height="256" aria-label="Animated sprite"></canvas>
        <div id="status">Loading catalog…</div>
      </section>
      <footer>
        <span id="details"></span>
        <a href="catalog.json">catalog.json</a>
      </footer>
    </main>
    <script type="module" src="player.js"></script>
  </body>
</html>
