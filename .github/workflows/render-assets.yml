name: Render HTML5 assets

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Models to rerender
        type: choice
        default: aquatic
        options:
          - aquatic
          - all

permissions:
  contents: read
  actions: read

concurrency:
  group: render-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render models (${{ inputs.scope || 'all' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BLENDER_VERSION: "5.3.0"
      BLENDER_BIN: ${{ github.workspace }}/.tools/blender/blender
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out source models and pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Find existing assets to preserve dinosaurs
        if: inputs.scope == 'aquatic'
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          def github(path):
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/{path}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          runs = github("actions/workflows/render-assets.yml/runs?status=success&branch=main&per_page=1")
          if not runs["workflow_runs"]:
              raise SystemExit("No previous full asset package exists. Choose scope=all for the first render.")
          run = runs["workflow_runs"][0]
          artifacts = github(f"actions/runs/{run['id']}/artifacts?per_page=100")["artifacts"]
          artifact = next(
              (item for item in artifacts if item["name"].startswith("html5-assets-") and not item["expired"]),
              None,
          )
          if artifact is None:
              raise SystemExit("The previous asset package is missing or expired. Choose scope=all.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run['id']}\nartifact_name={artifact['name']}\n")
          print(f"Preserving dinosaurs from {artifact['name']} ({run['html_url']}).")
          PY

      - name: Download existing full package
        if: inputs.scope == 'aquatic'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.artifact_name }}
          path: dist/

      - name: Record dinosaur file fingerprints
        if: inputs.scope == 'aquatic'
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from pipeline import discover_blends, slugify

          files = {}
          for source in discover_blends(["Dinosaur Animated Pack - Dec 2018/Blends"], None):
              folder = Path("dist") / slugify(source.stem)
              if not (folder / "manifest.json").is_file():
                  raise SystemExit(f"Missing preserved dinosaur: {source.stem}")
              for path in folder.rglob("*"):
                  if path.is_file():
                      files[path.as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          (Path(os.environ["RUNNER_TEMP"]) / "dinosaur-baseline.json").write_text(json.dumps(files))
          print(f"Recorded {len(files)} dinosaur files; these must remain byte-for-byte unchanged.")
          PY

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libsm6 libx11-6 libxcursor1 libxfixes3 \
            libxi6 libxinerama1 libxkbcommon0 libxrandr2 libxrender1 libxxf86vm1

      - name: Cache Blender installation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/blender
          key: blender-${{ env.BLENDER_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24-v1

      - name: Install and verify Blender
        run: |
          python3 pipeline.py setup --blender-version "$BLENDER_VERSION"
          "$BLENDER_BIN" --version

      - name: Render dinosaur models when requested
        if: inputs.scope != 'aquatic'
        run: >-
          python3 pipeline.py render
          --input "Dinosaur Animated Pack - Dec 2018/Blends"
          --blender-version "$BLENDER_VERSION"
          --engine cycles
          --style standard
          --size 256
          --fps 12
          --max-atlas-size 2048
          --output dist

      - name: Render all aquatic models with cartoon faces
        run: >-
          python3 pipeline.py render
          --input "Animated Fish Pack by @Quaternius/Blends"
          --blender-version "$BLENDER_VERSION"
          --engine cycles
          --style cartoon
          --add-face
          --size 256
          --fps 12
          --max-atlas-size 2048
          --output dist

      - name: Validate HTML5 assets
        run: python3 pipeline.py validate --output dist

      - name: Check model coverage and package licenses
        run: |
          python3 - <<'PY'
          import json
          import hashlib
          import os
          import shutil
          from pathlib import Path
          from pipeline import discover_blends, slugify

          output = Path("dist")
          sources = discover_blends(["."], None)
          catalog = json.loads((output / "catalog.json").read_text())
          expected = {slugify(source.stem) for source in sources}
          actual = {asset["id"] for asset in catalog["assets"]}
          if actual != expected or len(catalog["assets"]) != len(sources):
              raise SystemExit(
                  f"Model coverage failed: missing={sorted(expected - actual)}, "
                  f"unexpected={sorted(actual - expected)}, "
                  f"sources={len(sources)}, rendered={len(catalog['assets'])}"
              )

          aquatic_sources = discover_blends(["Animated Fish Pack by @Quaternius/Blends"], None)
          for source in aquatic_sources:
              manifest = json.loads((output / slugify(source.stem) / "manifest.json").read_text())
              if manifest.get("style") != "cartoon" or not manifest.get("generatedFace"):
                  raise SystemExit(f"Missing cartoon face render: {source.stem}")
          print(f"Verified cartoon shading and generated faces on {len(aquatic_sources)} aquatic models.")

          baseline = Path(os.environ["RUNNER_TEMP"]) / "dinosaur-baseline.json"
          if baseline.is_file():
              previous = json.loads(baseline.read_text())
              for filename, digest in previous.items():
                  path = Path(filename)
                  if not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != digest:
                      raise SystemExit(f"Preserved dinosaur file changed: {filename}")
              print(f"Verified {len(previous)} dinosaur files are unchanged.")

          licenses = output / "licenses"
          licenses.mkdir(exist_ok=True)
          for source in sources:
              license_file = source.parent.parent / "License.txt"
              if license_file.is_file():
                  shutil.copy2(license_file, licenses / f"{slugify(source.parent.parent.name)}.txt")

          manifests = [json.loads((output / asset["manifest"]).read_text()) for asset in catalog["assets"]]
          animations = sum(len(item["animations"]) for item in manifests)
          frames = sum(len(action["frames"]) for item in manifests for action in item["animations"].values())
          pages = sum(len(item["atlases"]) for item in manifests)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(
                  f"## HTML5 assets rendered\n\n"
                  f"{len(manifests)} models · {animations} animations · {frames} frames · {pages} atlas pages.\n\n"
                  "Transparent 256 × 256 PNG frames at 12 FPS, atlas pages up to 2048 × 2048.\n\n"
                  "Download the artifact below, extract it, and run "
                  "`python3 -m http.server 8000 --bind 127.0.0.1` in that folder. "
                  "Open <http://127.0.0.1:8000> to preview the animations.\n"
              )
          PY

      - name: Upload downloadable HTML5 assets
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html5-assets-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Link download in run summary
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: printf '\n[Download HTML5 asset ZIP](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Package preview for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

  deploy:
    name: Deploy HTML5 preview
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy rendered preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Link live preview in run summary
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: printf '\n[View all models and animations online](%s)\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
