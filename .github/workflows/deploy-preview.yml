name: Deploy preview without rendering

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy locally rendered assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out latest preview player
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check out locally rendered assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: published-assets
          path: dist/
          persist-credentials: false

      - name: Apply latest preview and validate assets
        run: |
          cp web/index.html web/player.js web/aquarium.js web/fishing.js web/style.css dist/
          python3 pipeline.py validate --output dist

      - name: Upload downloadable local assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html5-local-assets-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Package preview for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

      - name: Deploy rendered preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Link live preview in run summary
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: printf '\n[View all models and animations online](%s)\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
