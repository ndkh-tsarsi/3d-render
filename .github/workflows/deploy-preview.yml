name: Deploy preview without rendering

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy existing rendered assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out latest preview player
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find latest successful render artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          def github(path):
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/{path}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          runs = github("actions/workflows/render-assets.yml/runs?status=success&branch=main&per_page=1")
          if not runs["workflow_runs"]:
              raise SystemExit("No successful render is available. Run Render HTML5 assets first.")
          run = runs["workflow_runs"][0]
          artifacts = github(f"actions/runs/{run['id']}/artifacts?per_page=100")["artifacts"]
          artifact = next(
              (item for item in artifacts if item["name"].startswith("html5-assets-") and not item["expired"]),
              None,
          )
          if artifact is None:
              raise SystemExit("The render artifact has expired or is missing. A new render is required.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run['id']}\nartifact_name={artifact['name']}\n")
          print(f"Reusing {artifact['name']} from {run['html_url']}; no Blender render.")
          PY

      - name: Download existing HTML5 assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
          name: ${{ steps.source.outputs.artifact_name }}
          path: dist/

      - name: Apply latest preview and validate assets
        run: |
          cp web/index.html web/player.js web/style.css dist/
          python3 pipeline.py validate --output dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Package preview for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/

      - name: Deploy rendered preview
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Link live preview in run summary
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: printf '\n[View all models and animations online](%s)\n' "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
