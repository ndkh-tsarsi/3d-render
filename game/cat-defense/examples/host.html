<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cat Defense · plain JavaScript host</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#10293b;color:#f0fbff;font:16px system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:24px}h1{margin:0 0 8px}p{color:#b4ccd8;line-height:1.6}iframe{border:0;width:100%;aspect-ratio:16/10;min-height:430px;border-radius:20px;background:#1b473f}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0}button,input{font:inherit}button{border:0;border-radius:10px;background:#ffd172;color:#18394b;font-weight:700;padding:12px 18px;cursor:pointer}label{display:flex;align-items:center;gap:10px}pre{white-space:pre-wrap;background:#18394b;padding:18px;border-radius:12px;font:14px/1.6 monospace}a{color:#8df0d6}
  </style>
</head>
<body><main>
  <h1>Cat Defense / JavaScript host</h1>
  <p>This page has no React dependency. The game lives in an iframe and every control uses the public SDK.</p>
  <nav><button id="start" disabled>Start run</button><button id="shot" disabled>Shotgun</button><button id="blast" disabled>Explosion</button><button id="repair" disabled>Repair fence</button><label>Enemy speed <input id="speed" type="range" min="20" max="180" value="58"></label><a href="../index.html">Standalone game</a></nav>
  <iframe id="game" title="Cat Defense" allow="autoplay" sandbox="allow-scripts allow-same-origin"></iframe>
  <pre id="events">Connecting…</pre>
</main><script type="module">
  import {createCatDefenseClient} from '../sdk/index.js';
  const $=id=>document.getElementById(id);
  const client=createCatDefenseClient({iframe:$('game'),gameUrl:new URL('../index.html',location.href).href});
  const log=[];
  const write=(type,payload)=>{log.unshift(`${type} ${JSON.stringify(payload)}`);$('events').textContent=log.slice(0,8).join('\n');};
  client.on('*',(payload,type)=>{if(type==='state')return;write(type,['ready','initialized'].includes(type)?{status:payload.status,player:payload.player?.displayName,runId:payload.runId}:payload);});
  const invoke=action=>async()=>{try{const result=await action();if(result?.accepted===false)write('declined',result);}catch(error){write('error',{message:error.message});}};
  try{
    await client.ready();
    await client.init({player:{id:'plain-js-player',displayName:'JS Player'},runId:`run-${Array.from(crypto.getRandomValues(new Uint32Array(4))).join('-')}`,rules:{autoFire:false}});
    for(const id of ['start','shot','blast','repair'])$(id).disabled=false;
    $('start').onclick=invoke(()=>client.restart());
    $('shot').onclick=invoke(()=>client.fire({target:{x:.78,y:.6}}));
    $('blast').onclick=invoke(()=>client.explode({x:.72,y:.6}));
    $('repair').onclick=invoke(()=>client.repairFence(100));
    $('speed').onchange=invoke(()=>client.configure({enemySpeed:Number($('speed').value)}));
  }catch(error){write('error',{message:error.message});}
  window.addEventListener('pagehide',event=>{if(!event.persisted)client.destroy();});
</script></body></html>
